name: Build & Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "data/fraud_patterns/**"
      - "dags/**"
      - "requirements-api.txt"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  REGION: us-central1
  SERVICE: fraudlens-api
  AR_REPO: fraudlens

jobs:
  deploy-api:
    name: Build, push & deploy API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation — no JSON keys)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync model artifacts from GCS
        run: |
          mkdir -p mlruns
          gcloud storage rsync -r gs://${{ secrets.GCS_BUCKET }}/mlruns mlruns

      - name: Build and push image to Artifact Registry
        id: build
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/fraudlens-api
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push --all-tags $IMAGE
          echo "image=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # Only the image changes; env vars, secrets, scaling, and service account
      # set by infra/setup-gcp.sh are kept from the current revision.
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ steps.build.outputs.image }}

      - name: Smoke test
        run: |
          echo "API URL: ${{ steps.deploy.outputs.url }}"
          curl -fsS --retry 5 --retry-delay 5 --max-time 60 \
            "${{ steps.deploy.outputs.url }}/health" | python3 -m json.tool

  sync-dags:
    name: Sync Airflow DAGs to GCS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # The Airflow VM pulls gs://<bucket>/dags every 2 minutes
      - name: Upload DAGs
        run: gcloud storage rsync -r dags gs://${{ secrets.GCS_BUCKET }}/dags --exclude '__pycache__/.*'
